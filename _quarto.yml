# repo the "Run in Codespace" buttons open (switch to boxiang-wang/stat5400 when public)
codespace-repo: boxiang-wang/stat5400

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/*/*.qmd"
  resources:
    - "syllabus.pdf"
    - "notes/*/code/*"
    - "notes/*/*.pdf"
    - "notes/*/data/*"
    - "data/*"

website:
  title: "STAT 5400"
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/boxiang-wang/stat5400
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: "Section 1: Introduction"
        contents:
          - auto: "notes/section1/*.qmd"
      - section: "Section 2: R, Python, and APIs"
        contents:
          - auto: "notes/section2/*.qmd"
      - section: "Section 3: Simulation and Inference"
        contents:
          - auto: "notes/section3/*.qmd"

format:
  live-html:
    theme: cosmo
    css: styles.css
    toc: true
